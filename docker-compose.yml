services:
  log-sentinel:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./logs:/app/logs
    environment:
      # Defaults when not set in .env (do not inject empty API keys — Spring treats "" as set)
      LOG_FILE_PATH: ${LOG_FILE_PATH:-logs/log-sentinel-app.log}
      LOG_MAX_LINES_PER_FILE: ${LOG_MAX_LINES_PER_FILE:-5000}
      LOG_MAX_ROLLED_FILES: ${LOG_MAX_ROLLED_FILES:-3}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-8192}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma:2b}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      MAX_TOOL_CALLS: ${MAX_TOOL_CALLS:-1}
      RATE_LIMIT_RETRIES: ${RATE_LIMIT_RETRIES:-3}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_INCLUDE_THOUGHTS: ${GEMINI_INCLUDE_THOUGHTS:-false}
